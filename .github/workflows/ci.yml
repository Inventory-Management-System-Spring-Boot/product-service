name: CI

# Every service repo carries its own pipeline. That independence is the point of polyrepo:
# a change here builds, tests and (later) publishes an image for THIS service only, without
# rebuilding or retesting anything else in the system.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-progress run when a new commit lands on the same branch — no point burning
# CI minutes on a commit that is already superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          # Caches ~/.m2 keyed on pom.xml. Without it every run re-downloads the whole
          # dependency tree, which is the single biggest cause of slow Java CI.
          cache: maven

      # The Maven wrapper needs its executable bit. Git tracks the mode, but a file added
      # from a Windows machine or a web upload can lose it — this makes the failure mode
      # obvious rather than a confusing "permission denied" halfway through the run.
      - name: Ensure wrapper is executable
        run: chmod +x ./mvnw

      # -B batch mode (no interactive prompts, cleaner logs)
      # --no-transfer-progress suppresses per-artifact download spam
      # verify runs compile + test + package, so a broken build fails here, not on deploy
      - name: Build and test
        run: ./mvnw -B --no-transfer-progress verify

      # if: always() so the report is uploaded even when tests fail — which is exactly when
      # you need it. Skipping this on failure is a classic self-defeating CI mistake.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: product-service-jar
          path: target/*.jar
          retention-days: 7

# Arriving in later phases, once there is something to deploy:
#   Phase 2  build and push a Docker image to GHCR on every push to main
#   Phase 9  publish coverage, fail the build below a threshold
#   Phase 11 integration tests with Testcontainers (Docker is available on the runner)
