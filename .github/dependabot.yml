# Dependabot opens PRs when dependencies fall behind.
#
# This matters more in a polyrepo than a monorepo: with seven repos each pinning Spring Boot
# independently, versions drift apart silently. Dependabot makes that drift visible as a PR
# instead of something you discover during an incident.

version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Group the Spring dependencies into one PR. They are released as a tested-together set,
    # so reviewing them individually is both noisier and less safe.
    groups:
      spring:
        patterns:
          - "org.springframework*"
          - "org.springframework.boot*"
          - "org.springframework.cloud*"
    labels:
      - dependencies
    ignore:
      # Do not propose MAJOR Spring upgrades.
      #
      # This rule was written in response to a real failure: Dependabot's first run opened a
      # PR bumping Spring Boot 3.5.15 -> 4.1.0, and CI failed. Boot 4 renamed the starters
      # (spring-boot-starter-web became spring-boot-starter-webmvc) and, at the time of
      # writing, no Spring Cloud release train targets it - so the upgrade breaks the build
      # here and would break Eureka and Gateway from Phase 4 onward.
      #
      # A major Spring upgrade is a coordinated migration across every service in the
      # system, not a routine dependency bump. Patch and minor updates still flow through
      # automatically, which is where the security fixes are.
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.springframework.cloud:*"
        update-types: ["version-update:semver-major"]

  # Keeps the GitHub Actions in ci.yml current too — pinned action versions go stale and
  # eventually stop receiving security fixes.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - ci
